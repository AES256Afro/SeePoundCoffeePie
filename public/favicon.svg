<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">SeePoundCoffeePie</title>
  <desc id="description">An eye, pound cake, coffee cup, and pie arranged as a four-part code academy emblem.</desc>
  <defs>
    <linearGradient id="panel" x1="8" y1="5" x2="56" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17332b"/>
      <stop offset="1" stop-color="#091512"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="#071310"/>
  <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#panel)" stroke="#6fb991" stroke-width="1.5"/>
  <path d="M32 7v50M7 32h50" stroke="#315047" stroke-width="1.25"/>

  <!-- See: an eye with two C++ sparkles. -->
  <path d="M8 19c3-5 7-7 11-7s8 2 11 7c-3 5-7 7-11 7s-8-2-11-7Z" fill="none" stroke="#70d5ee" stroke-width="2"/>
  <circle cx="19" cy="19" r="3.5" fill="#70d5ee"/>
  <path d="M10 10v4M8 12h4M27 9v4M25 11h4" stroke="#f2c14e" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Pound cake: a golden slice with a hash scored into the icing. -->
  <path d="M38 13h16l-2 13H40l-2-13Z" fill="#d59a55" stroke="#f2c14e" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M38 13c3-3 13-3 16 0" fill="none" stroke="#fff0b0" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M44 16l-1 7M49 16l-1 7M41 18h11M41 21h10" fill="none" stroke="#6f426d" stroke-width="1.25" stroke-linecap="round"/>

  <!-- Coffee: the Java cup. -->
  <path d="M11 42h14v5a7 7 0 0 1-14 0v-5Zm14 2h2.5a3 3 0 0 1 0 6H25" fill="none" stroke="#ff936b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M15 39c-2-2 2-3 0-5M21 39c-2-2 2-3 0-5" fill="none" stroke="#f2c14e" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Pie: a mint wedge with a pi-shaped crust vent. -->
  <path d="M37 52 42 37c6 1 11 5 14 10L37 52Z" fill="#9ce4b5" stroke="#d9ffe6" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M42 37c6 1 11 5 14 10" fill="none" stroke="#f2c14e" stroke-width="3" stroke-linecap="round"/>
  <path d="M43 44h8M45 44v5M49 44v5" fill="none" stroke="#315047" stroke-width="1.6" stroke-linecap="round"/>
</svg>
