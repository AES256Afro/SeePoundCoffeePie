<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">SeePoundCoffeePie</title>
  <desc id="description">An eye emblem combining the See, pound cake, coffee, and pie symbols.</desc>
  <defs>
    <radialGradient id="space" cx="50%" cy="42%" r="65%">
      <stop stop-color="#17382f"/>
      <stop offset="1" stop-color="#071310"/>
    </radialGradient>
  </defs>

  <!-- One circular badge and one continuous symbol scene, with no quadrant grid. -->
  <circle cx="32" cy="32" r="30" fill="#06110e"/>
  <circle cx="32" cy="32" r="28.5" fill="url(#space)" stroke="#75c99b" stroke-width="1.5"/>

  <!-- See and C++: a literal eye with iris, pupil, highlight, and two plus stars. -->
  <path d="M6.5 32c6.5-10 15-15 25.5-15s19 5 25.5 15C51 42 42.5 47 32 47S13 42 6.5 32Z" fill="#0a1c18" stroke="#70d5ee" stroke-width="2"/>
  <circle cx="32" cy="32" r="10" fill="#70d5ee" fill-opacity="0.42" stroke="#70d5ee" stroke-width="1.2"/>
  <circle cx="32" cy="32" r="5" fill="#06110e" stroke="#a9efff" stroke-width="1"/>
  <circle cx="35" cy="29" r="1.8" fill="#f2f8e9"/>
  <path d="M19 9v6M16 12h6M45 9v6M42 12h6" stroke="#f2c14e" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Pound cake sits across the lower-left of the eye. -->
  <path d="M8.5 34 12 24h13l3 14-19.5-4Z" fill="#d49a58" stroke="#f2c14e" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M12 24c3-2 9-2 13 0" fill="none" stroke="#fff0b0" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M16 27l-1 7M21 27l-1 8M13 29h11M13 32h12" fill="none" stroke="#6f426d" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Coffee remains the central symbol and focal point. -->
  <path d="M25 26h15v9a7.5 7.5 0 0 1-15 0v-9Z" fill="#ff936b" stroke="#ffd09a" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M40 28h2a4 4 0 0 1 0 8h-2" fill="none" stroke="#ff936b" stroke-width="2"/>
  <path d="M29 23c-3-3 3-4 0-7M35 23c-3-3 3-4 0-7" fill="none" stroke="#f2c14e" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M23 42h22" stroke="#75c99b" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Pie sits across the lower-right, with a pi-shaped vent. -->
  <path d="M40 38 43 23c6 2 10 6 13 11l-16 4Z" fill="#9ce4b5" stroke="#d9ffe6" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M43 23c6 2 10 6 13 11" fill="none" stroke="#f2c14e" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M45 29h7M47 29v5M51 29v5" fill="none" stroke="#315047" stroke-width="1.5" stroke-linecap="round"/>

</svg>
