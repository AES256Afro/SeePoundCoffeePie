<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 164 48" role="img" aria-labelledby="title description">
  <title id="title">SeePoundCoffeePie symbol mark</title>
  <desc id="description">An eye, pound cake marked with a hash, coffee, and pie arranged as four colorful symbols.</desc>
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- See and C++ -->
  <g transform="translate(22 23)" fill="none" stroke="#70d5ee" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M-18 0C-10-11 10-11 18 0 10 11-10 11-18 0Z" fill="#70d5ee" fill-opacity="0.12" stroke-width="2"/>
    <circle r="7" fill="#70d5ee" fill-opacity="0.38" stroke-width="1.8"/>
    <circle r="3.4" fill="#071310" stroke-width="1.2"/>
    <circle cx="2.2" cy="-2.2" r="1.2" fill="#f2f8e9" stroke="none"/>
    <path d="M-13-14v5M-15.5-11.5h5M13-14v5M10.5-11.5h5" stroke="#f2c14e" stroke-width="1.4"/>
  </g>

  <!-- Pound cake and C# -->
  <g transform="translate(45 5)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M2 31 5 10h28l4 21H2Z" fill="#d49a58" stroke="#f2c14e" stroke-width="1.5"/>
    <path d="M5 10c6-5 21-5 28 0l2 7H4l1-7Z" fill="#a34de2" stroke="#d6a3ff" stroke-width="1.5"/>
    <path d="M15 10 13 23M24 10l-2 13M10 14h20M9 19h21" fill="none" stroke="#fff0b0" stroke-width="1.5"/>
    <path d="M2 33h35" stroke="#8b55a8" stroke-width="1.5"/>
  </g>

  <!-- Coffee and Java -->
  <g transform="translate(91 7)" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M3 15h24v10a10 10 0 0 1-20 0V15Z" fill="#ff936b" fill-opacity="0.3" stroke="#ffad62" stroke-width="2"/>
    <path d="M27 18h3a5 5 0 0 1 0 10h-4" stroke="#ffad62" stroke-width="2"/>
    <path d="M10 11c-3-3 3-4 0-9M19 11c-3-3 3-4 0-9" stroke="#f2c14e" stroke-width="1.8"/>
    <path d="M1 37h31" stroke="#ffad62" stroke-width="1.6"/>
  </g>

  <!-- Pie and Python -->
  <g transform="translate(129 6)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M2 33 7 7c13 2 23 10 28 22L2 33Z" fill="#9ce4b5" fill-opacity="0.34" stroke="#a9ffbf" stroke-width="1.8"/>
    <path d="M7 7c13 2 23 10 28 22" fill="none" stroke="#f2c14e" stroke-width="3"/>
    <path d="M13 18h14M17 18v9M24 18v9" fill="none" stroke="#315047" stroke-width="2"/>
    <path d="M2 36h34" stroke="#75c99b" stroke-width="1.5"/>
  </g>
</svg>
