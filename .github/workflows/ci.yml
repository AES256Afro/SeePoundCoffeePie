name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Verify text style
        run: npm run check:text-style

      - name: Verify social preview
        run: npm run check:social-preview

      - name: Build production bundle
        run: npm run build

      - name: Verify server-owned assessment privacy
        run: npm run check:project-bundle

      - name: Verify public-site deployment freezes runner images
        run: npm run check:public-site-deploy

      - name: Verify bundle budgets
        run: npm run check:bundle
