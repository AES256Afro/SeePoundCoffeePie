name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Verify Practical C++ content and runner gates
        run: npm run check:cpp-content-candidate

      - name: Verify packed foundation curriculum
        run: npm run check:foundation-content

      - name: Run lint
        run: npm run lint

      - name: Verify text style
        run: npm run check:text-style

      - name: Verify academy curriculum structure
        run: npm run check:academy-curriculum

      - name: Verify no-assumed-knowledge learner language
        run: npm run check:learner-language

      - name: Verify social preview
        run: npm run check:social-preview

      - name: Build production bundle
        run: npm run build

      - name: Verify server-owned assessment privacy
        run: npm run check:project-bundle

      - name: Verify public-site deployment freezes runner images
        run: npm run check:public-site-deploy

      - name: Verify bundle budgets
        run: npm run check:bundle

      - name: Run browser release gate
        run: npm run test:e2e:built

      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-gate
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
